name: Update IP Database

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get IPverse latest release timestamp
        id: ipverse
        run: |
          RELEASE=$(curl -s https://api.github.com/repos/ipverse/country-ip-blocks/releases/latest)
          PUBLISHED_AT=$(echo "$RELEASE" | jq -r '.published_at')
          # e.g. 2026-01-17T14:50:31Z → tag ipverse-2026-01-17T1450Z, label "2026-01-17 14:50 UTC"
          DATE=$(echo "$PUBLISHED_AT" | cut -c1-10)
          HHMM=$(echo "$PUBLISHED_AT" | sed 's/.*T//' | cut -c1-5 | tr -d ':')
          TAG="ipverse-${DATE}T${HHMM}Z"
          LABEL="${DATE} ${HHMM:0:2}:${HHMM:2:2} UTC"
          echo "published_at=$PUBLISHED_AT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"                   >> "$GITHUB_OUTPUT"
          echo "label=$LABEL"               >> "$GITHUB_OUTPUT"

      - name: Check if we already built this version
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.ipverse.outputs.tag }}")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: sudo apt-get install -y sqlite3 jq

      - name: Build database
        if: steps.check.outputs.exists == 'false'
        run: ./geoip-sqlite-ipverse.sh

      - name: Publish as GitHub Release asset
        if: steps.check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ipverse.outputs.tag }}" \
            --title "GeoIP — IPverse ${{ steps.ipverse.outputs.label }}" \
            --notes "SQLite database built from [IPverse country-ip-blocks](https://github.com/ipverse/country-ip-blocks) data released on \`${{ steps.ipverse.outputs.published_at }}\`.

          ## Schema

          | Table | IP version | Range columns |
          |-------|-----------|---------------|
          | \`ip_blocks_v4\` | IPv4 | \`ip_start\`, \`ip_end\` as 32-bit integers |
          | \`ip_blocks_v6\` | IPv6 | \`ip_start\`, \`ip_end\` as 32-char hex strings |

          ## Quick lookup

          \`\`\`sh
          # country for 8.8.8.8
          export IP=8.8.8.8 && sqlite3 ip_to_country.db \
            \"SELECT country_code FROM ip_blocks_v4 WHERE \$(python3 -c 'import ipaddress,os; print(int(ipaddress.ip_address(os.environ[\"IP\"])))') BETWEEN ip_start AND ip_end LIMIT 1;\"
          \`\`\`" \
            build/ip_to_country.db

      - name: Already up to date
        if: steps.check.outputs.exists == 'true'
        run: echo "Already up to date (IPverse published_at=${{ steps.ipverse.outputs.published_at }})."
